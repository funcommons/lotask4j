server:
  port: 9081
  servlet:
    context-path: /

spring:
  application:
    name: lotask4j-demo

# ASTS 服务器配置
asts:
  server:
    url: http://localhost:8080

# 日志配置
logging:
  level:
    root: INFO
    fun.commons.lotask4j.demo: DEBUG
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/demo.log
    max-size: 10MB
    max-history: 30
