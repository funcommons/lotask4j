<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTS 可视化演示平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .scenario-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: left;
        }

        .scenario-btn:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .scenario-btn:active {
            transform: scale(0.98);
        }

        .task-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .task-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-id {
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-weight: bold;
        }

        .task-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-PENDING {
            background: #ffc107;
            color: #fff;
        }

        .status-RUNNING {
            background: #17a2b8;
            color: #fff;
        }

        .status-SUCCESS {
            background: #28a745;
            color: #fff;
        }

        .status-FAILED {
            background: #dc3545;
            color: #fff;
        }

        .status-CANCELLED {
            background: #6c757d;
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .task-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-refresh {
            background: #17a2b8;
            color: white;
        }

        .btn-cancel {
            background: #dc3545;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }

        .toast.success {
            border-left: 5px solid #28a745;
        }

        .toast.error {
            border-left: 5px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚀 ASTS 可视化演示平台</h1>
            <p>Asynchronous Slow Task Service - 实时任务执行演示</p>
        </div>

        <!-- Dashboard Stats -->
        <div class="dashboard">
            <div class="stat-card">
                <h3>总任务数</h3>
                <div class="value" id="totalTasks">0</div>
            </div>
            <div class="stat-card">
                <h3>运行中</h3>
                <div class="value" id="runningTasks" style="color: #17a2b8;">0</div>
            </div>
            <div class="stat-card">
                <h3>已完成</h3>
                <div class="value" id="completedTasks" style="color: #28a745;">0</div>
            </div>
            <div class="stat-card">
                <h3>失败</h3>
                <div class="value" id="failedTasks" style="color: #dc3545;">0</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Scenarios Panel -->
            <div class="panel">
                <h2>📋 演示场景</h2>
                <div class="scenario-list">
                    <button class="scenario-btn" onclick="runScenario('export')">
                        📊 数据导出任务
                    </button>
                    <button class="scenario-btn" onclick="runScenario('transcode')">
                        🎬 视频转码任务
                    </button>
                    <button class="scenario-btn" onclick="runScenario('report')">
                        📈 报表生成任务
                    </button>
                    <button class="scenario-btn" onclick="runScenario('batch')">
                        📧 批量通知任务
                    </button>
                    <button class="scenario-btn" onclick="runScenario('full')">
                        🔄 完整流程演示
                    </button>
                    <button class="scenario-btn" onclick="clearAllTasks()" style="background: #dc3545;">
                        🗑️ 清空所有任务
                    </button>
                </div>
            </div>

            <!-- Tasks Panel -->
            <div class="panel">
                <h2>📝 任务列表 <span style="font-size: 0.8rem; color: #999;">(自动刷新)</span></h2>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
                <div class="task-list" id="taskList">
                    <p style="text-align: center; color: #999; padding: 40px 0;">
                        暂无任务，请选择左侧场景开始演示
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'http://localhost:8081/demo';
        let tasks = new Map();
        let autoRefreshInterval;

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Run scenario
        async function runScenario(type) {
            try {
                document.getElementById('loading').classList.add('active');
                let endpoint = '';

                switch(type) {
                    case 'export':
                        endpoint = '/export';
                        break;
                    case 'transcode':
                        endpoint = '/transcode';
                        break;
                    case 'report':
                        endpoint = '/report';
                        break;
                    case 'batch':
                        endpoint = '/batch';
                        break;
                    case 'full':
                        endpoint = '/full-flow';
                        break;
                }

                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.code === 0) {
                    showToast(`✅ 任务提交成功! ID: ${data.data.taskId.substring(0, 8)}...`, 'success');
                    // 立即刷新任务列表
                    await refreshTasks();
                } else {
                    showToast(`❌ 任务提交失败: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('Error running scenario:', error);
                showToast('❌ 请求失败，请确保后端服务已启动', 'error');
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        // Refresh tasks
        async function refreshTasks() {
            try {
                // 模拟获取任务列表 - 实际应该从后端 API 获取
                // 这里使用模拟数据演示
                renderTasks();
                updateStats();
            } catch (error) {
                console.error('Error refreshing tasks:', error);
            }
        }

        // Render tasks
        function renderTasks() {
            const taskList = document.getElementById('taskList');

            if (tasks.size === 0) {
                taskList.innerHTML = `
                    <p style="text-align: center; color: #999; padding: 40px 0;">
                        暂无任务，请选择左侧场景开始演示
                    </p>
                `;
                return;
            }

            const tasksArray = Array.from(tasks.values()).reverse();

            taskList.innerHTML = tasksArray.map(task => `
                <div class="task-item">
                    <div class="task-header">
                        <div class="task-id">${task.taskId.substring(0, 16)}...</div>
                        <div class="task-status status-${task.status}">${task.status}</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${task.progress}%"></div>
                    </div>
                    <div class="task-details">
                        <div class="detail-item">
                            <span class="detail-label">类型:</span>
                            <span>${task.type}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">进度:</span>
                            <span>${task.progress}%</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">优先级:</span>
                            <span>${task.priority}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">创建时间:</span>
                            <span>${new Date(task.createdAt).toLocaleTimeString()}</span>
                        </div>
                    </div>
                    <div class="controls">
                        <button class="btn btn-refresh" onclick="refreshTask('${task.taskId}')">
                            🔄 刷新
                        </button>
                        ${task.status === 'PENDING' || task.status === 'RUNNING' ? `
                            <button class="btn btn-cancel" onclick="cancelTask('${task.taskId}')">
                                ❌ 取消
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            const tasksArray = Array.from(tasks.values());
            document.getElementById('totalTasks').textContent = tasksArray.length;
            document.getElementById('runningTasks').textContent =
                tasksArray.filter(t => t.status === 'RUNNING').length;
            document.getElementById('completedTasks').textContent =
                tasksArray.filter(t => t.status === 'SUCCESS').length;
            document.getElementById('failedTasks').textContent =
                tasksArray.filter(t => t.status === 'FAILED').length;
        }

        // Refresh single task
        async function refreshTask(taskId) {
            showToast(`🔄 刷新任务 ${taskId.substring(0, 8)}...`, 'success');
            // 模拟刷新 - 实际应该调用后端 API
        }

        // Cancel task
        async function cancelTask(taskId) {
            if (confirm('确定要取消这个任务吗？')) {
                showToast(`❌ 取消任务 ${taskId.substring(0, 8)}...`, 'success');
                // 模拟取消 - 实际应该调用后端 API
            }
        }

        // Clear all tasks
        function clearAllTasks() {
            if (confirm('确定要清空所有任务吗？')) {
                tasks.clear();
                renderTasks();
                updateStats();
                showToast('🗑️ 已清空所有任务', 'success');
            }
        }

        // Simulate task updates (for demo purposes)
        function simulateTaskUpdate(taskId) {
            const task = tasks.get(taskId);
            if (!task) return;

            if (task.status === 'PENDING') {
                task.status = 'RUNNING';
                task.progress = 10;
            } else if (task.status === 'RUNNING' && task.progress < 100) {
                task.progress = Math.min(task.progress + Math.random() * 30, 100);
                if (task.progress >= 100) {
                    task.status = Math.random() > 0.2 ? 'SUCCESS' : 'FAILED';
                    task.progress = 100;
                }
            }

            tasks.set(taskId, task);
        }

        // Add mock task (for demo)
        function addMockTask(type) {
            const taskId = 'mock-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            const task = {
                taskId: taskId,
                type: type,
                status: 'PENDING',
                progress: 0,
                priority: Math.floor(Math.random() * 100),
                createdAt: new Date().toISOString()
            };
            tasks.set(taskId, task);

            // 模拟任务进度更新
            const interval = setInterval(() => {
                simulateTaskUpdate(taskId);
                renderTasks();
                updateStats();

                const currentTask = tasks.get(taskId);
                if (currentTask && (currentTask.status === 'SUCCESS' || currentTask.status === 'FAILED')) {
                    clearInterval(interval);
                }
            }, 2000);
        }

        // Auto refresh
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                tasks.forEach((task, taskId) => {
                    if (task.status === 'RUNNING' || task.status === 'PENDING') {
                        simulateTaskUpdate(taskId);
                    }
                });
                renderTasks();
                updateStats();
            }, 3000);
        }

        // Initialize
        window.addEventListener('load', () => {
            console.log('ASTS 可视化演示平台已加载');
            startAutoRefresh();

            // 添加欢迎提示
            setTimeout(() => {
                showToast('👋 欢迎使用 ASTS 可视化演示平台！', 'success');
            }, 500);
        });

        // Override runScenario to add mock tasks
        const originalRunScenario = runScenario;
        runScenario = async function(type) {
            const typeMap = {
                'export': 'data_export',
                'transcode': 'video_transcode',
                'report': 'report_generation',
                'batch': 'batch_notification',
                'full': 'full_workflow'
            };

            addMockTask(typeMap[type] || 'unknown');
            renderTasks();
            updateStats();

            showToast(`✅ ${typeMap[type]} 任务已提交!`, 'success');
        };
    </script>
</body>
</html>
