# =============================================
# Web Embed 部署配置
# =============================================

# 1. 编译前端
cd lotask4j-web-embed-frontend
npm install
npm run build

# 2. 部署前端到 Nginx 静态目录
sudo mkdir -p /opt/asts/web-embed-frontend
sudo cp -r dist/* /opt/asts/web-embed-frontend/

# 3. 配置 Nginx
# 在 /etc/nginx/conf.d/asts.conf 添加：

server {
    listen 80;
    server_name your-domain.com;

    # Web Embed 前端静态资源（SPA history 模式）
    location /web-embed/ {
        alias /opt/asts/web-embed-frontend/;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # Web Embed Controller（重定向 + 写 Cookie）
    location /web-embed/task-list {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /web-embed/task-detail {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
    }

    location /web-embed/task-card {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
    }

    # Client API
    location /api/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
    }
}

# 4. 验证
curl -I http://your-domain.com/web-embed/task-list
# 期望：302 重定向 + Set-Cookie: ASTS_USER_ID=xxx + Location: /index.html?component=task-list
