spring:
  application:
    name: lotask4j  # 必须配置，用于 ID 生成和 Token Key

    # 排除 MybatisPlusAutoConfiguration 自动配置
  autoconfigure:
    exclude:
     - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
     - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
     - org.redisson.spring.starter.RedissonAutoConfigurationV2

  # Jackson时区配置（北京时间 CST 规范）
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  # FastJSON2时区配置（北京时间 CST 规范）
  fastjson2:
    writer-features:
      - WriteDateUseDateFormat
    format:
      date-format: yyyy-MM-dd HH:mm:ss
      time-zone: GMT+8

  # Flyway 数据库迁移 (benefit4j 模式)
  # baseline-on-migrate: 已有表的存量库只打 baseline 标记 (baseline-version 起), V2+ 才执行;
  # 全新空库 (新环境/CI) 从 V1__baseline.sql 全量建表。
  # 独立 datasource 直连 (不走 Druid): Druid Wall 会拦 Flyway 脚本的部分 PG 语法 (benefit4j 已踩坑)。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '1'
    validate-on-migrate: true
    url: ${LDX_DEV_DB_URL:jdbc:postgresql://localhost:5432/lotask4j}
    user: ${LDX_DEV_DB_USERNAME:admin}
    password: ${LDX_DEV_DB_PASSWORD:}

# framework4j SDK 配置
framework4j:
  # framework4j-transport (v1.4.2+) — 修复 issue #18：使用 ObjectProvider<RestTemplate> +
  # 可选 rest-template-bean-name 配置；多 RestTemplate 场景下不再抛 NoUniqueBeanDefinitionException。
  # 项目未直接使用 HttpTransport 接口，框架默认装配的 framework4jHttpTransport 走降级路径
  # (多 RestTemplate + 未配置 bean-name + 无 @Primary → 框架内置默认实例 + WARN)，不影响业务。
  # 若后续业务要复用 framework4jHttpTransport,再按需指定 rest-template-bean-name。

  # 分布式 ID 生成配置
  id:
    worker:
      strategy: ip  # 本地测试 / Spring Boot 启动用 IP 即可，不需要 Redis 分布式协调
      redis-name: stringRedisTemplate
    mybatis:
      enabled: true  # 自动集成 MyBatis Plus ID 生成器

  # OpenID 安全混淆配置
  openid:
    fastjson2:
      enabled: true   # 启用 FastJson2 支持
    jackson:
      enabled: false  # 未使用 Jackson
    swagger:
      enabled: true   # 启用 Swagger 文档适配

  # 多数据源配置
  datasource:
    enabled: true
    datasources:
      business:
        aliases: [default, primary]
        type: com.alibaba.druid.pool.DruidDataSource
        url: ${LDX_DEV_DB_URL:jdbc:postgresql://localhost:5432/lotask4j}
        username: ${LDX_DEV_DB_USERNAME:admin}
        password: ${LDX_DEV_DB_PASSWORD:}
        driver-class-name: org.postgresql.Driver
        druid:
          initial-size: 5
          min-idle: 5
          max-active: 20
          validation-query: SELECT 1
          test-on-borrow: false
          test-on-return: false
          test-while-idle: true
          time-between-eviction-runs-millis: 60000
          min-evictable-idle-time-millis: 300000
          # 核心配置：开启 stat (监控) 和 slf4j (日志) 过滤器
          filters: stat,slf4j
          # 针对 slf4j 过滤器的具体配置
          filter:
            slf4j:
              enabled: true
              # 【重点】是否打印实际运行的 SQL（把 ? 替换为真实参数）
              statement-executable-sql-log-enable: true
              # 是否打印 SQL 执行日志
              statement-log-enabled: true
              # 打印 SQL 的日志级别 (DEBUG/INFO/WARN/ERROR)
              statement-log-error-enabled: true

        mybatis-plus:
          mapper-locations: classpath*:/mapper/**/*.xml
          type-aliases-package: fun.commons.lotask4j.entity
          configuration:
            map-underscore-to-camel-case: true
            cache-enabled: true
            lazy-loading-enabled: true
        sql-tracing:
          mode: ALL

  # 多 Redis 配置
  redis:
    enabled: true
    datasources:
      # 缓存 Redis (字符串类型)
      default:
        # host: localhost
        host: ${LDX_DEV_REDIS_HOST:localhost}
        password: ${LDX_DEV_REDIS_PASSWORD:}
        port: 6379
        database: 0
        aliases: [cache]
        template-type: string  # StringRedisTemplate
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
        redisson:
          enabled: false

      # 业务 Redis (对象类型)
      business:
        # host: localhost
        host: ${LDX_DEV_REDIS_HOST:localhost}
        password: ${LDX_DEV_REDIS_PASSWORD:}
        port: 6379
        database: 1
        template-type: object  # RedisTemplate<String, Object>，使用 fastjson2 序列化
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
        redisson:
          enabled: false

      # 分布式锁 Redis (字符串 + Redisson)
      lock:
        # host: localhost
        host: ${LDX_DEV_REDIS_HOST:localhost}
        password: ${LDX_DEV_REDIS_PASSWORD:}
        port: 6379
        database: 2
        template-type: string
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
        redisson:
          enabled: false

  # 审计日志 (framework4j-audit; framework4j-tenant 依赖链带活, 默认开启)
  # lotask4j 当前未规划审计表, 显式关闭 (后续启用时建 audit 表 + enabled: true)
  audit:
    enabled: false

  # 多租户横切面 (framework4j-tenant, benefit4j 同款)
  # 租户表 = {table-prefix}tenant → asts_tenant (由 AstsTenant extends TenantEntity SPI 提供, DDL 走 Flyway)
  # 认证端点 /api/v1/auth/token 由模块内置 TenantAuthEndpoint 接管: 防爆破(5次/15min) +
  #   平台合成租户(tenant_id=0) + 密钥双版本宽限期(24h) + reset 撤全部会话
  # 数据隔离 = 业务表手动 tenant_id (模块无 SQL 拦截器), PG RLS POLICY 兜底 (V4 手建, rls.mode OFF)
  tenant:
    enabled: true
    table-prefix: asts_          # 租户表 = asts_tenant
    ddl-mode: PROVIDED           # DDL 由 Flyway V4 管理 (框架只在启动时输出模板)
    # default-tenant-id 不配 = 多租户模式 (无 tenant_id claim 的租户域请求 → 403)
    auth:
      enabled: true              # 内置 TenantAuthEndpoint 接管 /api/v1/auth/token (旧 AuthController 已删)
      path: /api/v1/auth/token
      token-type: TENANT         # 新项目直接 TENANT 型 (无存量会话负担, 不用 APP 兼容开关)
      expire-seconds: 28800      # 8h (M2M 口径, 上限 12h)
    platform:
      client-id: ${PLATFORM_CLIENT_ID:PLATFORM}
      # 平台管理面凭据 (替换原 ADMIN_CLIENT_SECRET); 空值 = 平台凭据不启用
      client-secret: ${PLATFORM_CLIENT_SECRET:lotask4j-platform-dev-secret}
    secret:
      grace-hours: 24            # reset-secret 后旧钥宽限期
    registration-key:
      enabled: false             # 注册码自助注册通道, 暂不开放
    rls:
      mode: off                  # 策略由 Flyway V4 手建 (benefit4j 同款), 框架不干预

  # 访问令牌配置 (client_credentials 认证 — 仿 benefit4j)
  access-token:
    enabled: true
    secretKey: ${TOKEN_SECRET:default-secret-key-change-in-production}  # 生产环境必须通过环境变量配置 (≥32 字符)
    hashSalt: ${LDX_HASH_SALT:lotask4j-token-salt-change-me-in-prod}
    expireTime: 86400  # 全局默认过期时间（秒）
    redis-name: default  # framework4j-redis 多数据源的 cache 库 (default 别名 cache)

    # 不做 token 校验的路径
    exclude-path-patterns:
      - /api/v1/auth/token      # tenant 模块内置端点 (自动配置也会代填, 显式保留)
      # client/worker 域三域守卫 (2026-09 租户化): @TenantDomain + @RequiresToken("TENANT") —
      # 平台域 (admin) @PlatformDomain 要求 tenant_id=0; 租户域要求 tenant_id>0
      - /web-embed/**
      - /web-embed
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error

    policies:
      # 租户/平台统一 TENANT 型 (内置端点签发, claims: tenant_id; 平台身份=0, 真实租户>0)
      # 互斥键 tenant_id: 同一租户新 token 踢旧 (单租户单会话); reset-secret 时按此 key 批量撤销
      TENANT:
        key: [tenant_id]
        expireTime: 28800   # 8h, 与 tenant.auth.expire-seconds 对齐
        autoRenew: true     # 滑动续期
        renewIncrement: 1800

  # 限流 (framework4j-rate-limit, benefit4j 模式)
  # 注解驱动: @RateLimit 注解决定规则 (方法级, 类级不生效), path-patterns 只圈定拦截范围;
  # 维度: 带 token 按租户维度 (claim tenant_id), 无 token 自动回退来源 IP (X-Forwarded-For 优先)
  # 算法: Redis Lua 滑动窗口; 环回 IP (127.0.0.1/::1) 默认在 IP 白名单, 本地调试不受限
  rate-limit:
    enabled: true
    redis-name: default
    key-prefix: lotask4j:rl
    default-scope: APP
    default-limit: 100          # @RateLimit 未写 limit 时的兜底
    default-window: 1m
    default-algorithm: SLIDING_WINDOW
    path-patterns:
      - /api/v1/client/**
      - /api/v1/worker/**
      - /api/v1/admin/**
    whitelist-paths:
      - /api/v1/auth/token      # 换 token 端点不限流, 防锁死

  # 字段级加密 (framework4j-sensitive) — asts_tenant.tenant_secret AES-256-GCM 落库
  # 生产必须通过环境变量 AES_KEY 注入 (32 字节 hex 或 base64)
  sensitive:
    enabled: true
    encryption-key: ${AES_KEY:12345678901234567890123456789012}

  # HMAC-SHA256 请求签名 (framework4j-signature, benefit4j 模式; 只圈 client 域写端点)
  # 契约与 frontend/src/utils/signature.ts、lotask4j-demo AstsClient 对齐:
  #   X-Access-Key / X-Timestamp(ms) / X-Nonce(UUID) / X-Signature
  #   toSign = [METHOD, path, timestamp, nonce, MD5(body)].join("\n")
  # SecretProvider 由 DbSecretProvider 提供 (asts_tenant 解密 tenant_secret; X-Access-Key=租户 id)
  signature:
    enabled: true
    timestamp-tolerance-ms: 300000   # ±5min
    nonce-ttl-seconds: 600           # nonce 10min 一次性防重放
    nonce-key-prefix: lotask4j:sig:nonce
    redis-name: default
    path-patterns:
      - /api/v1/client/tasks/submit   # POST-only 子路径 (GET 列表在根路径, 不受影响)
      - /api/v1/client/tasks/*/cancel
    exclude-path-patterns: []

# lotask4j 应用配置
lotask4j:
  security:
    admin:
      # 已废弃 (C 阶段): 控制台改用 framework4j.tenant.platform.* 凭据 (PLATFORM_CLIENT_SECRET)
      client-id: ${ADMIN_CLIENT_ID:ADMIN}
      client-secret: ${ADMIN_CLIENT_SECRET:}

# 日志配置
logging:
  level:
    root: INFO
    framework4j: INFO  # framework4j SDK 日志
    framework4j.id: DEBUG  # ID 生成器日志（调试 WorkerId）
    framework4j.datasource: DEBUG
    com.alibaba.druid: INFO  # Druid 连接池日志
    com.alibaba.druid.filter: DEBUG
    com.alibaba.druid.filter.stat.StatFilter: DEBUG  # SQL 统计日志
    org.springframework.web: INFO
    druid.sql.Statement: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  file:
    name: logs/${spring.application.name}.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB

# 服务端口配置
server:
  port: 9080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

  # 分布式追踪配置
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # 采样率 1.0 = 100% (生产环境建议 0.1-0.3)

  # OpenTelemetry OTLP 导出配置
  otlp:
    tracing:
      # endpoint: http://localhost:4318/v1/traces  # OTLP HTTP 端点 (Jaeger/Tempo/OpenTelemetry Collector)
      # 如果不需要导出到收集器，注释掉 endpoint 或设置为空
      # endpoint: ""

# OpenTelemetry 资源配置
otel:
  resource:
    attributes:
      service.name: ${spring.application.name}  # 服务名称
      service.version: 1.0.0
      deployment.environment: ${DEPLOY_ENV:dev}  # 部署环境
  traces:
    exporter: otlp  # 使用 OTLP 导出器
  logs:
    exporter: none  # 暂不导出日志（可选：otlp, logging）
  metrics:
    exporter: none  # 暂不导出指标（已有 Prometheus）

# OpenAPI 文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# 应用配置
app:
  # 异步线程池配置
  async:
    core-pool-size: 10            # 核心线程数
    max-pool-size: 50             # 最大线程数
    queue-capacity: 1000          # 队列容量
    thread-name-prefix: "async-executor-"  # 线程名称前缀
    wait-for-tasks-to-complete-on-shutdown: true  # 等待任务完成后再关闭
    await-termination-seconds: 60  # 等待时间（秒）

  # ASTS 服务配置
  asts:
    # Worker 心跳间隔（秒）
    heartbeat-interval: 30
    # Reaper 清理间隔（秒）
    reaper-interval: 60
    # 任务执行超时时间（秒）
    default-timeout: 600
    # 最大重试次数
    max-retries: 3
    # 默认 lease 秒数（worker poll 之后持锁时长，到期不续约视为失联）
    default-lease-seconds: 120
    # 续约允许时间余量（lease_buffer_sec）：worker 必须早于 lease_expire_at 这么久发起续约
    lease-buffer-seconds: 20
    # 并发执行任务数
    worker-concurrency: 5
    # 轮询任务的间隔（秒）
    poll-interval: 1

  # Webhook 回调配置
  webhook:
    # 最大重试次数
    max-retries: 3
    # 重试间隔（秒）
    retry-interval: 5
    # 请求超时（秒）— 被 HttpClientConfig#webhookRestTemplate 读取
    timeout-seconds: 30

  # 步骤配置
  steps:
    # 最大步骤数
    max-steps: 100
    # 步骤更新间隔（毫秒）
    update-interval: 1000

  # Web Embed 组件配置
  web-embed:
    # 前端入口 URL（Vite + Vue3 history 模式，部署在 /web-embed/ 路径下）
    front-base-url: /web-embed/index.html
    # 开放模式默认 userId
    open-default-user-id: guest
    # 回调验证超时（秒）
    callback-timeout-seconds: 3
    # Cookie 有效期（秒）
    cookie-expire-seconds: 7200
    # 嵌入 URL 基础地址（用于后台生成预览 URL）
    embed-base-url: http://localhost:9080
