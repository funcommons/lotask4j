# starter 测试基线 (仅测试 classpath, 不随 JAR 发布) — 原 lotask4j-backend 主 application.yml 的
# framework4j 宿主侧声明等价物; 测试覆写见 application-test.yml (@ActiveProfiles("test"))
spring:
  application:
    name: lotask4j-test  # 必须配置, 用于 ID 生成和 Token Key

  # Jackson时区配置（北京时间 CST 规范）
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  # FastJSON2时区配置（北京时间 CST 规范）
  fastjson2:
    writer-features:
      - WriteDateUseDateFormat
    format:
      date-format: yyyy-MM-dd HH:mm:ss
      time-zone: GMT+8

# framework4j SDK 宿主侧声明 (键名保持原样, issue #4 决策)
framework4j:
  id:
    worker:
      strategy: ip
      redis-name: stringRedisTemplate
    mybatis:
      enabled: true

  openid:
    fastjson2:
      enabled: true
    jackson:
      enabled: false
    swagger:
      enabled: true

  # 多数据源 — 测试 PG (CI service container / 本地 docker PG, 与 application-test.yml 对齐)
  datasource:
    enabled: true
    datasources:
      business:
        aliases: [default, primary]
        type: com.alibaba.druid.pool.DruidDataSource
        url: ${LDX_DEV_DB_URL:jdbc:postgresql://localhost:5432/lotask4j}?stringtype=unspecified
        username: ${LDX_DEV_DB_USERNAME:admin}
        password: ${LDX_DEV_DB_PASSWORD:test@2026}
        driver-class-name: org.postgresql.Driver
        druid:
          initial-size: 0
          min-idle: 0
          max-active: 10
          validation-query: SELECT 1
          # 显式压掉 framework4j 默认 wall 过滤器 — wall 会拦 schema-postgres.sql 的
          # PG 部分索引 (CREATE INDEX ... WHERE) 语法 (sql injection violation)
          filters: stat,slf4j
        mybatis-plus:
          mapper-locations: classpath*:/mapper/**/*.xml
          type-aliases-package: fun.commons.lotask4j.entity
          configuration:
            map-underscore-to-camel-case: true
            cache-enabled: true
            lazy-loading-enabled: true
        sql-tracing:
          mode: ALL

  # 多 Redis — CI redis:7 service container / 本地 :6379
  redis:
    enabled: true
    datasources:
      default:
        host: ${LDX_DEV_REDIS_HOST:localhost}
        password: ${LDX_DEV_REDIS_PASSWORD:}
        port: 6379
        database: 0
        aliases: [cache]
        template-type: string
        redisson:
          enabled: false
      business:
        host: ${LDX_DEV_REDIS_HOST:localhost}
        password: ${LDX_DEV_REDIS_PASSWORD:}
        port: 6379
        database: 1
        template-type: object
        redisson:
          enabled: false
      lock:
        host: ${LDX_DEV_REDIS_HOST:localhost}
        password: ${LDX_DEV_REDIS_PASSWORD:}
        port: 6379
        database: 2
        template-type: string
        redisson:
          enabled: false

  audit:
    enabled: false

  tenant:
    enabled: true
    table-prefix: asts_
    ddl-mode: PROVIDED
    auth:
      enabled: true
      path: /api/v1/auth/token
      token-type: TENANT
      expire-seconds: 28800
    platform:
      client-id: ${PLATFORM_CLIENT_ID:PLATFORM}
      client-secret: ${PLATFORM_CLIENT_SECRET:lotask4j-platform-dev-secret}
    secret:
      grace-hours: 24
    registration-key:
      enabled: false
    rls:
      mode: off

  access-token:
    enabled: true
    secretKey: ${TOKEN_SECRET:default-secret-key-change-in-production}
    hashSalt: ${LDX_HASH_SALT:lotask4j-token-salt-change-me-in-prod}
    expireTime: 86400
    redis-name: default
    exclude-path-patterns:
      - /api/v1/auth/token
      - /web-embed/**
      - /web-embed
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error
    policies:
      TENANT:
        key: [tenant_id]
        expireTime: 28800
        autoRenew: true
        renewIncrement: 1800

  rate-limit:
    enabled: true
    redis-name: default
    key-prefix: lotask4j:rl
    default-scope: APP
    default-limit: 100
    default-window: 1m
    default-algorithm: SLIDING_WINDOW
    path-patterns:
      - /api/v1/client/**
      - /api/v1/worker/**
      - /api/v1/admin/**
    whitelist-paths:
      - /api/v1/auth/token

  sensitive:
    enabled: true
    encryption-key: ${AES_KEY:12345678901234567890123456789012}

  signature:
    enabled: true
    timestamp-tolerance-ms: 300000
    nonce-ttl-seconds: 600
    nonce-key-prefix: lotask4j:sig:nonce
    redis-name: default
    path-patterns:
      - /api/v1/client/tasks/submit
      - /api/v1/client/tasks/*/cancel
    exclude-path-patterns: []

# 测试库由 sql.init + schema-postgres.sql 每次重建, Flyway 关闭避免两套建表机制打架
# (Flyway 迁移路径由 scripts/smoke.sh 在 compose 环境覆盖)
lotask4j:
  flyway:
    enabled: false
