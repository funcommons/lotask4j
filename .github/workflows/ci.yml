name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security — secrets & dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  backend:
    name: Backend — mvn verify (embed bundled, 435 tests + 100% line gate)
    runs-on: ubuntu-latest
    needs: security
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test@2026
          POSTGRES_DB: lotask4j
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d lotask4j"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # embed 组件随 JAR 发布: 先构建并同步进 backend static (该目录 gitignore)
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js (embed build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build & sync embed widget
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build:embed
          pnpm --dir frontend sync-embed

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 测试库 (application-test.yml): localhost:5432/lotask4j, admin/test@2026 — 与 services 对齐
      - name: Run backend tests + JaCoCo 100% line gate
        run: mvn -B -pl lotask4j-backend -am verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: lotask4j-backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend — pnpm verify + e2e
    runs-on: ubuntu-latest
    needs: security
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + eslint + unit tests (222)
        run: pnpm verify

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config 无 webServer, CI 自起 dev server (dev-mock 零后端)
      # 视觉基线 (visual) 按 darwin 平台生成, Linux CI 字体渲染必然超差 — 仅本地跑
      - name: Run e2e (smoke + regression, 视觉用例除外)
        run: |
          pnpm dev > /tmp/vite-dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9083/ > /dev/null && break
            sleep 1
          done
          pnpm test:e2e --grep-invert "visual"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
