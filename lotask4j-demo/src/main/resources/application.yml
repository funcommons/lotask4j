server:
  port: 9081
  servlet:
    context-path: /

spring:
  application:
    name: lotask4j-demo

# ASTS 服务器配置
asts:
  server:
    url: http://localhost:9080
  client:
    # 租户凭据 (管理端创建租户时一次性下发; 默认租户 secret 为 V4 迁移占位值,
    # 生产请经管理端 reset-secret 重置后配置)
    access-key: ${ASTS_CLIENT_ACCESS_KEY:default}
    secret: ${ASTS_CLIENT_SECRET:test-default-tenant-secret}

# 日志配置
logging:
  level:
    root: INFO
    fun.commons.lotask4j.demo: DEBUG
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/demo.log
    max-size: 10MB
    max-history: 30
